<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moose Runner — Браузерная игра</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 75%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      user-select: none;
    }

    .game-wrapper {
      width: 100%;
      max-width: 840px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(245, 158, 11, 0.08);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding: 0.9rem 1.4rem;
      background: linear-gradient(90deg, #161e31 0%, #1e293b 100%);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title span {
      color: #f59e0b;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .scores {
      display: flex;
      gap: 1.2rem;
      font-size: 1rem;
      color: #94a3b8;
    }

    .score-card {
      background: rgba(9, 13, 22, 0.6);
      padding: 0.4rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .scores strong {
      color: #fbbf24;
      font-size: 1.25rem;
      font-family: monospace;
      margin-left: 0.3rem;
    }

    .canvas-box {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #131b2e;
      transition: background-color 0.8s ease;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.84);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
      z-index: 10;
    }

    .overlay h2 {
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
    }

    .overlay p {
      color: #cbd5e1;
      font-size: 1.05rem;
      margin-bottom: 1.6rem;
      max-width: 480px;
      line-height: 1.5;
    }

    #startBtn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #090d16;
      border: none;
      padding: 0.95rem 2.5rem;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #startBtn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.65);
    }

    .controls-hint {
      text-align: center;
      margin-top: 1.2rem;
      color: #94a3b8;
      font-size: 0.92rem;
    }

    .controls-hint span {
      background-color: #1e293b;
      color: #fbbf24;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #334155;
      margin: 0 0.15rem;
    }
        .skins-box {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1.4rem;
    }

    .skin-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 2px solid #334155;
      padding: 0.45rem 0.8rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .skin-btn.active {
      border-color: #fbbf24;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
    }

    .skin-btn.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="hud">
      <div class="title">🫎 MOOSE <span>RUNNER</span></div>
      <div class="scores">
        <div class="score-card">Рекорд: <strong id="highScore">0000</strong></div>
        <div class="score-card">Счёт: <strong id="currentScore">0000</strong></div>
      </div>
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="800" height="300"></canvas>

      <div class="overlay" id="gameOverlay">
        <h2 id="overlayTitle">ГОТОВ К ЗАБЕГУ?</h2>
        <p id="overlaySubtitle">Перепрыгивай скалы и серых летучих мышей. Редкие 🍄 мухоморы дают неуязвимость и x2 очки!</p>
                <div class="skins-box" id="skinsBox"></div>

        <button id="startBtn" type="button">▶ ИГРАТЬ</button>
      </div>
    </div>

    <div class="controls-hint">
      Управление: <span>Пробел</span> / <span>↑</span> / <span>Клик мышкой или пальцем</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');
    const startBtn = document.getElementById('startBtn');

    let highScore = Number(localStorage.getItem('mooseRunnerHigh')) || 0;
    highScoreEl.textContent = String(highScore).padStart(4, '0');

    let isRunning = false;
    let score = 0;
    let gameSpeed = 4.2;
    let frameCount = 0;
    let animationId;

    let mushrooms = [];
    let powerTimer = 0;
    let nextMushroomScore = 450;

    const player = {
      x: 70,
      y: 204,
      width: 46,
      height: 50,
      dy: 0,
      jumpForce: 13.5,
      gravity: 0.72,
      grounded: false,
      jumps: 0
    };

    const groundY = 254;
    let obstacles = [];
    let particles = [];
    let shakeTimer = 0;

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.8) * 6,
          size: 3 + Math.random() * 3,
          color,
          life: 25 + Math.random() * 15
        });
      }
    }

    const stars = Array.from({ length: 22 }, (_, i) => ({
      x: (i * 43) % 800,
      y: 20 + ((i * 29) % 150),
      size: i % 3 === 0 ? 2 : 1
    }));

    let audioCtx = null;

    function playSound(freq, duration, type = 'square') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playPowerupSound() {
      playSound(523, 0.1, 'triangle');
      setTimeout(() => playSound(659, 0.1, 'triangle'), 80);
      setTimeout(() => playSound(784, 0.18, 'triangle'), 160);
    }

    function jump() {
      if (player.jumps < 2 && isRunning) {
        player.dy = -player.jumpForce;
        player.grounded = false;
        player.jumps++;
        playSound(player.jumps === 1 ? 460 : 620, 0.12);
      }
    }

    startBtn.addEventListener('click', startGame);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!isRunning) {
          startGame();
        } else {
          jump();
        }
      }
    });

    canvas.addEventListener('pointerdown', () => {
      if (isRunning) jump();
    });

    function startGame() {
      isRunning = true;
      score = 0;
      gameSpeed = 4.2;
      frameCount = 0;
      obstacles = [];
      mushrooms = [];
      powerTimer = 0;
      nextMushroomScore = Math.floor(450 + Math.random() * 150);
      player.y = groundY - player.height;
      player.dy = 0;
      player.grounded = true;
      player.jumps = 0;
           particles = [];
      shakeTimer = 0;
 
      canvas.style.backgroundColor = '#131b2e';
      overlay.style.display = 'none';
      cancelAnimationFrame(animationId);
      update();
    }

    function spawnObstacle() {
      const type = Math.random();

      if (type > 0.7 && score > 80) {
        obstacles.push({
          kind: 'bat',
          x: canvas.width + 20,
          y: groundY - 78,
          width: 40,
          height: 24
        });
      } else {
        const isTall = Math.random() > 0.5;
        obstacles.push({
          kind: 'rock',
          x: canvas.width + 20,
          y: groundY - (isTall ? 52 : 36),
          width: isTall ? 36 : 28,
          height: isTall ? 52 : 36
        });
      }
    }
    function drawBackground() {
      // 1. Луна и ореол
      ctx.fillStyle = 'rgba(254, 240, 138, 0.12)';
      ctx.beginPath();
      ctx.arc(690, 62, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(690, 62, 18, 0, Math.PI * 2);
      ctx.fill();

      // 2. Звёзды
      ctx.fillStyle = '#cbd5e1';
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const starX = ((s.x - frameCount * 0.2) % canvas.width + canvas.width) % canvas.width;
        ctx.fillRect(starX, s.y, s.size, s.size);
      }

      // 3. Далёкие горы (медленный параллакс)
      ctx.fillStyle = '#192238';
      for (let i = 0; i < 6; i++) {
        const mx = ((i * 180 - frameCount * 0.5) % 1080 + 1080) % 1080 - 140;
        ctx.beginPath();
        ctx.moveTo(mx, groundY);
        ctx.lineTo(mx + 90, groundY - 95);
        ctx.lineTo(mx + 180, groundY);
        ctx.fill();
      }

      // 4. Силуэты ёлок на горизонте (средний параллакс)
      ctx.fillStyle = '#0d1322';
      for (let i = 0; i < 10; i++) {
        const tx = ((i * 95 - frameCount * 1.2) % 950 + 950) % 950 - 60;
        const h = 42 + (i % 3) * 14;
        // Ствол
        ctx.fillRect(tx + 11, groundY - 8, 4, 8);
        // Три яруса лап ёлки
        ctx.beginPath();
        ctx.moveTo(tx, groundY - 8);
        ctx.lineTo(tx + 13, groundY - h * 0.55);
        ctx.lineTo(tx + 26, groundY - 8);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(tx + 3, groundY - h * 0.4);
        ctx.lineTo(tx + 13, groundY - h * 0.8);
        ctx.lineTo(tx + 23, groundY - h * 0.4);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(tx + 6, groundY - h * 0.65);
        ctx.lineTo(tx + 13, groundY - h);
        ctx.lineTo(tx + 20, groundY - h * 0.65);
        ctx.fill();
      }

      // 5. Лесной костёр на заднем плане (появляется периодически)
      const fireX = ((420 - frameCount * 1.2) % 950 + 950) % 950 - 60;
      // Тёплое свечение вокруг костра
      ctx.fillStyle = 'rgba(249, 115, 22, 0.14)';
      ctx.beginPath();
      ctx.arc(fireX + 10, groundY - 10, 26 + (frameCount % 6), 0, Math.PI * 2);
      ctx.fill();

      // Дрова
      ctx.fillStyle = '#451a03';
      ctx.fillRect(fireX + 2, groundY - 4, 16, 4);

      // Живое пламя (меняет высоту каждый кадр)
      const flicker = Math.sin(frameCount * 0.4) * 3;
      ctx.fillStyle = '#f97316';
      ctx.fillRect(fireX + 4, groundY - 12 - flicker, 12, 8 + flicker);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(fireX + 7, groundY - 9 - flicker * 0.6, 6, 5 + flicker * 0.6);

      // Летящая вверх искра
      const sparkY = groundY - 14 - (frameCount % 25);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(fireX + 8 + Math.sin(frameCount * 0.2) * 4, sparkY, 2, 2);
    }
   
    let currentSkin = localStorage.getItem('mooseSkin') || 'default';

    const skins = [
      { id: 'default', name: '🫎 Обычный', req: 0, body: '#854d0e', horn: '#f5f5f4', legs: '#422006', nose: null },
      { id: 'rudolph', name: '🦌 Олень (300)', req: 300, body: '#b45309', horn: '#fde68a', legs: '#78350f', nose: '#ef4444' },
      { id: 'gold', name: '👑 Золотой (700)', req: 700, body: '#eab308', horn: '#ffffff', legs: '#a16207', nose: null },
      { id: 'ghost', name: '👻 Призрак (1200)', req: 1200, body: '#2dd4bf', horn: '#ccfbf1', legs: '#0f766e', nose: '#a855f7' }
    ];

    function renderSkins() {
      const box = document.getElementById('skinsBox');
      if (!box) return;
      box.innerHTML = '';
      skins.forEach(s => {
        const unlocked = highScore >= s.req;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'skin-btn' + (currentSkin === s.id ? ' active' : '') + (!unlocked ? ' locked' : '');
        btn.textContent = unlocked ? s.name.split(' (')[0] : `🔒 ${s.req}`;
        btn.onclick = () => {
          if (!unlocked) return;
          currentSkin = s.id;
          localStorage.setItem('mooseSkin', currentSkin);
          playSound(600, 0.08, 'triangle');
          renderSkins();
        };
        box.appendChild(btn);
      });
    }
    renderSkins();

    function drawPlayer() {
      const x = player.x;
      const y = player.y;
      const isPowered = powerTimer > 0;
      const skin = skins.find(s => s.id === currentSkin) || skins[0];

      const bodyColor = isPowered && frameCount % 6 < 3 ? '#f59e0b' : skin.body;
      const hornColor = isPowered ? '#fef08a' : skin.horn;

      // Ветвистые рога
      ctx.fillStyle = hornColor;
      ctx.fillRect(x + 24, y, 4, 14);
      ctx.fillRect(x + 19, y + 3, 14, 4);
      ctx.fillRect(x + 17, y, 4, 6);
      ctx.fillRect(x + 31, y + 1, 4, 6);

      // Туловище и шея
      ctx.fillStyle = bodyColor;
      ctx.fillRect(x + 6, y + 22, 26, 15);
      ctx.fillRect(x + 24, y + 14, 10, 12);
      ctx.fillRect(x + 2, y + 24, 4, 5);

      // Голова и морда
      ctx.fillRect(x + 26, y + 11, 18, 11);
      ctx.fillRect(x + 36, y + 15, 10, 8);
      ctx.fillRect(x + 30, y + 22, 4, 5);

      // Цветной нос для Оленя и Призрака
      if (skin.nose) {
        ctx.fillStyle = skin.nose;
        ctx.fillRect(x + 43, y + 15, 4, 4);
      }

      // Глаз
      ctx.fillStyle = isPowered ? '#ef4444' : '#ffffff';
      ctx.fillRect(x + 31, y + 13, 3, 3);

      // Ноги
      ctx.fillStyle = skin.legs;
      if (!player.grounded) {
        ctx.fillRect(x + 8, y + 37, 4, 8);
        ctx.fillRect(x + 14, y + 37, 4, 6);
        ctx.fillRect(x + 24, y + 37, 4, 8);
        ctx.fillRect(x + 29, y + 37, 4, 6);
      } else {
        const step = Math.floor(frameCount / 7) % 2 === 0;
        ctx.fillRect(x + 8, y + 37, 4, step ? 13 : 8);
        ctx.fillRect(x + 14, y + 37, 4, step ? 8 : 13);
        ctx.fillRect(x + 24, y + 37, 4, step ? 8 : 13);
        ctx.fillRect(x + 29, y + 37, 4, step ? 13 : 8);
      }
    }

      const x = obs.x;
      const y = obs.y;

      if (obs.kind === 'rock') {
        ctx.fillStyle = '#64748b';
        const steps = 7;
        const stepHeight = obs.height / steps;

        for (let i = 0; i < steps; i++) {
          const ratio = (i + 1) / steps;
          const rowWidth = obs.width * ratio;
          const rowX = x + (obs.width - rowWidth) / 2;
          ctx.fillRect(rowX, y + i * stepHeight, rowWidth, stepHeight + 1);
        }

        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(x + obs.width / 2 - 2, y + 5, 3, obs.height - 7);
      } else {
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(x + 14, y + 7, 12, 13);
        ctx.fillRect(x + 14, y + 3, 3, 4);
        ctx.fillRect(x + 23, y + 3, 3, 4);

        ctx.fillStyle = '#f97316';
        ctx.fillRect(x + 16, y + 10, 3, 3);
        ctx.fillRect(x + 21, y + 10, 3, 3);

        ctx.fillStyle = '#cbd5e1';
        const flapUp = Math.floor(frameCount / 6) % 2 === 0;
        if (flapUp) {
          ctx.fillRect(x + 1, y + 1, 13, 6);
          ctx.fillRect(x + 26, y + 1, 13, 6);
        } else {
          ctx.fillRect(x + 1, y + 12, 13, 6);
          ctx.fillRect(x + 26, y + 12, 13, 6);
        }
      }
    }

    function drawMushroom(m) {
      const x = m.x;
      const y = m.y;

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x + 9, y + 12, 8, 12);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x + 2, y + 4, 22, 9);
      ctx.fillRect(x + 6, y, 14, 4);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 6, y + 6, 3, 3);
      ctx.fillRect(x + 13, y + 3, 3, 3);
      ctx.fillRect(x + 17, y + 8, 3, 3);
    }

       function update() {
      if (!isRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;

      // Тряска экрана
      ctx.save();
      if (shakeTimer > 0) {
        shakeTimer--;
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
      }

      drawBackground();

      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      ctx.fillStyle = '#334155';
      for (let i = 0; i < 8; i++) {
        const stoneX = ((i * 115 - frameCount * gameSpeed) % canvas.width + canvas.width) % canvas.width;
        ctx.fillRect(stoneX, groundY + 8 + (i % 3) * 6, 6, 3);
      }

      if (powerTimer > 0) {
        powerTimer--;
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(20, 16, (powerTimer / 360) * 160, 8);
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('🍄 ЯРОСТЬ + x2 ОЧКИ!', 190, 25);
      }

      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y + player.height >= groundY) {
        // Пыль из-под копыт при приземлении
        if (!player.grounded) {
          spawnParticles(player.x + 15, groundY - 2, '#94a3b8', 5);
        }
        player.y = groundY - player.height;
        player.dy = 0;
        player.grounded = true;
        player.jumps = 0;
      }

      drawPlayer();

      const spawnRate = Math.max(65, Math.floor(125 - gameSpeed * 3));
      if (frameCount % spawnRate === 0) {
        spawnObstacle();
      }

      if (score >= nextMushroomScore) {
        mushrooms.push({
          x: canvas.width + 80,
          y: groundY - 24,
          width: 26,
          height: 24
        });
        nextMushroomScore += Math.floor(450 + Math.random() * 250);
      }

      for (let i = mushrooms.length - 1; i >= 0; i--) {
        const m = mushrooms[i];
        m.x -= gameSpeed;
        drawMushroom(m);

        if (
          player.x < m.x + m.width &&
          player.x + player.width > m.x &&
          player.y < m.y + m.height &&
          player.y + player.height > m.y
        ) {
          score += 50;
          powerTimer = 360;
          playPowerupSound();
          // Золотой салют при подборе мухомора
          spawnParticles(m.x + 12, m.y + 12, '#fbbf24', 12);
          mushrooms.splice(i, 1);
          continue;
        }

        if (m.x + m.width < 0) {
          mushrooms.splice(i, 1);
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        drawObstacle(obs);

        if (
          player.x + 8 < obs.x + obs.width - 4 &&
          player.x + player.width - 6 > obs.x + 4 &&
          player.y + 6 < obs.y + obs.height - 4 &&
          player.y + player.height - 4 > obs.y + 4
        ) {
          if (powerTimer > 0) {
            score += 25;
            playSound(280, 0.1);
            // Разлёт осколков и тряска экрана при сносе препятствия
            spawnParticles(obs.x + 15, obs.y + 15, obs.kind === 'rock' ? '#94a3b8' : '#f97316', 14);
            shakeTimer = 10;
            obstacles.splice(i, 1);
            continue;
          } else {
            ctx.restore();
            gameOver();
            return;
          }
        }

        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }

      // Отрисовка всех частиц (пыль, осколки, салют)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        if (p.life <= 0) particles.splice(i, 1);
      }

      ctx.restore();

      if (frameCount % 5 === 0) {
        score += powerTimer > 0 ? 2 : 1;
        scoreEl.textContent = String(score).padStart(4, '0');

        if (score % 100 === 0) {
          gameSpeed += 0.25;
        }

        if (score % 600 === 300) {
          canvas.style.backgroundColor = '#1e1b38';
        } else if (score % 600 === 0) {
          canvas.style.backgroundColor = '#131b2e';
        }
      }

      animationId = requestAnimationFrame(update);
    }

    function gameOver() {
      isRunning = false;
      cancelAnimationFrame(animationId);
      playSound(140, 0.35);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('mooseRunnerHigh', highScore);
        highScoreEl.textContent = String(highScore).padStart(4, '0');
                renderSkins();

      }

      overlayTitle.textContent = 'ИГРА ОКОНЧЕНА!';
      overlaySubtitle.innerHTML = `Твой счёт: <strong>${score}</strong> • Рекорд: <strong>${highScore}</strong>`;
      startBtn.textContent = '↻ ЕЩЁ РАЗ';
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
