<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moose Runner — Браузерная игра</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 75%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      user-select: none;
    }

    .game-wrapper {
      width: 100%;
      max-width: 840px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(245, 158, 11, 0.08);
      backdrop-filter: blur(10px);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding: 0.9rem 1.4rem;
      background: linear-gradient(90deg, #161e31 0%, #1e293b 100%);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title span {
      color: #f59e0b;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .scores {
      display: flex;
      gap: 1.8rem;
      font-size: 1rem;
      color: #94a3b8;
    }

    .score-card {
      background: rgba(9, 13, 22, 0.6);
      padding: 0.4rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .scores strong {
      color: #fbbf24;
      font-size: 1.25rem;
      font-family: monospace;
      margin-left: 0.3rem;
    }

    .canvas-box {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #131b2e;
      transition: background-color 0.8s ease;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
    }

    .overlay h2 {
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
    }

    .overlay p {
      color: #cbd5e1;
      font-size: 1.05rem;
      margin-bottom: 1.6rem;
      max-width: 480px;
      line-height: 1.5;
    }

    #startBtn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #090d16;
      border: none;
      padding: 0.95rem 2.5rem;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #startBtn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.65);
    }

    .controls-hint {
      text-align: center;
      margin-top: 1.2rem;
      color: #94a3b8;
      font-size: 0.92rem;
    }

    .controls-hint span {
      background-color: #1e293b;
      color: #fbbf24;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #334155;
      margin: 0 0.15rem;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="hud">
      <div class="title">🫎 MOOSE <span>RUNNER</span></div>
      <div class="scores">
        <div class="score-card">Рекорд: <strong id="highScore">0000</strong></div>
        <div class="score-card">Счёт: <strong id="currentScore">0000</strong></div>
      </div>
    </div>

    <div class="canvas-box">
      <canvas id="gameCanvas" width="800" height="300"></canvas>

      <div class="overlay" id="gameOverlay">
        <h2 id="overlayTitle">ГОТОВ К ЗАБЕГУ?</h2>
        <p id="overlaySubtitle">Перепрыгивай скалы и серых летучих мышей. Редкие 🍄 мухоморы дают неуязвимость и x2 очки!</p>
        <button id="startBtn" onclick="startGame()">▶ ИГРАТЬ</button>
      </div>
    </div>

    <div class="controls-hint">
      Управление: <span>Пробел</span> / <span>↑</span> / <span>Клик мышкой или пальцем</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
